schema_version: "1.0"
name: jbit-hero-unattended
description: >-
  The hero command "JBIT, just build it. Autopilot, lean." loads jbit:autopilot, writes the Agents line as lean, and
  runs unattended: stage 2, whose risk line names auth, is built without pausing for the user's approval.
tags: [trigger, arming, jbit-command]
context:
  scaffold_script: scaffold.sh
execution:
  # The user's own JBIT command: the hook sets the run unattended. No Bash, so the case runs where the eval sandbox
  # can't start; the graders look at the first moves of the run, not a finished stage.
  prompt: JBIT, just build it. Autopilot, lean.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill, Agent]
graders:
  - type: tool_used
    name: loads-autopilot
    tool: Skill
    input_match: "autopilot"
    min: 1
    arm: with-only
  - type: llm
    name: agents-line-lean
    focus: { source: file, path: docs/PLAN.md }
    arm: with-only
    criteria: 'The plan''s Now section has the line "Agents: lean".'
  - type: llm
    name: builds-risky-stage-unattended
    focus: trace
    arm: with-only
    criteria: >-
      The agent takes over the plan as unattended autopilot and starts building stage 2 (CSV input) — it, or a
      builder agent it spawns, writes application code such as src/cli.js — without first pausing to ask the user to
      approve the stage because its risk line names auth and personal data. It does not set the Mode line to
      "paused" for the risk, and does not end its turn asking for "yes", "approve" or similar before building.
  - type: regex
    name: no-push
    target: trace
    pattern: "git push"
    match: not_contains
