schema_version: "1.0"
name: just-build-it-approves
description: >-
  With autopilot paused on a stage whose risk line names auth, "Just build it." is the user's approval: the
  approval is logged, the Mode line goes back to autopilot, and the stage is built.
tags: [trigger, arming]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Just build it.
  max_turns: 20
  allowed_tools: [Read, Glob, Grep, Edit, Write, Skill, Agent]
graders:
  - type: tool_used
    name: loads-autopilot
    tool: Skill
    input_match: "autopilot"
    min: 1
    arm: with-only
  - type: llm
    name: approval-logged
    focus: { source: file, path: docs/PLAN.md }
    arm: with-only
    criteria: >-
      The plan's Decisions section has a new dated entry recording that the user approved stage 2 (the auth and
      personal data stage). The Now section's Mode line no longer waits for that approval: it reads "Mode:
      autopilot", or is paused for a later, different reason (such as being unable to run the tests), never for the
      stage's risk or the user's approval.
  - type: llm
    name: builds-approved-stage
    focus: trace
    criteria: >-
      The agent treats "Just build it." as the approval of the held stage and starts building stage 2 (CSV input):
      it, or a builder agent it spawns, writes application code such as src/cli.js. It does not ask the user to
      approve the stage again.
