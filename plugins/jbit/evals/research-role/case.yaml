schema_version: "1.0"
name: research-role
description: >-
  Under `Models: build sonnet/medium · research sonnet/high · review opus/high`, a plan update that turns on an outside
  rule (how long EU members' emails may be kept) hands the question to a research agent started with
  `model: sonnet, effort: high`, the line's research setting; no agent is started with an effort the line doesn't
  name, and the plan's Models line is left as it was.
tags: [models, research, outcome]
context:
  scaffold_script: scaffold.sh
execution:
  # No Bash, so the case runs where the eval sandbox can't start; planning and research need none.
  # The Models line is in the plan from the start, so the session honours it on its first read.
  prompt: >-
    JBIT plan: before stage 2 is built, research how long we may keep unconfirmed signups' and departed members'
    emails under the GDPR, and settle stage 2's retention period in the plan. Don't write any code; assume sensible
    defaults rather than asking me questions.
  max_turns: 30
  allowed_tools: [Read, Glob, Grep, Write, Edit, Skill, Agent, WebSearch, WebFetch]
graders:
  - type: tool_used
    name: loads-plan
    tool: Skill
    input_match: "plan"
    min: 1
    arm: with-only
  - type: tool_used
    name: research-on-sonnet-high
    tool: Agent
    input_match: '^(?=.*"model":\s*"sonnet")(?=.*"effort":\s*"high")'
    min: 1
    arm: with-only
  - type: tool_used
    name: no-other-effort
    tool: Agent
    input_match: '"effort":\s*"(?:low|xhigh|max)"'
    min: 0
    max: 0
    arm: with-only
  # Deterministic, not an llm judge on the trace: the judge's trace excerpt can leave the Agent call out (0.18.0 stage 4).
  - type: tool_used
    name: no-agent-on-build-or-review-setting
    tool: Agent
    input_match: '"model":\s*"opus"|"effort":\s*"medium"'
    min: 0
    max: 0
    arm: with-only
  - type: llm
    name: models-line-kept
    # an llm grader on the file: a regex grader's `target: files` matches changed paths, not contents
    focus:
      source: file
      path: docs/PLAN.md
    arm: with-only
    criteria: >-
      The plan's `## Now` still contains the line `Models: build sonnet/medium · research sonnet/high · review opus/high`,
      exactly.
  - type: file_exists
    name: writes-research-note
    path: "docs/research/*.md"
    arm: with-only
